spring :
    servlet :
        multipart :
            max-file-size :    10MB
            max-request-size : 10MB
    datasource :

        # PostgreSQL
        url :      jdbc:postgresql://localhost:5432/flyway
        #

        # MySQL
#        url :      jdbc:mysql://localhost:3306/pageva
        #

        username : postgres
        password : katudus
    jpa :
        hibernate :
            # схему меняет только Flyway, Hibernate лишь сверяет сущности с таблицами
            ddl-auto : validate
        show-sql : true

        # PostgreSQL
        properties :
            hibernate :
                dialect : org.hibernate.dialect.PostgreSQLDialect
                jdbc :
                    lob :
                        non_contextual_creation : true
        #

    flyway :
        enabled :              true
        locations :            classpath:db/migration
        validate-on-migrate :  true
        baseline-on-migrate :  false

server :
    port : 8080

springdoc :
  api-docs :
    path : /v3/api-docs
  swagger-ui :
    path : /swagger-ui.html
  override-with-generic-response : false   # показывать только ответы, описанные в @ApiResponse
  packages-to-scan : com.app.book, com.app.book_copy, com.app.book_ordering, com.app.appUser, com.app.security
