<div class="container-fluid py-5">

	<h1 class="text-center" data-aos="zoom-in">Аккаунт</h1>

</div>

<div class="container py-5">

	<div class="row">
		<div class="col-12 col-lg-4 mb-4" data-aos="zoom-in">
			<input type="file" (change)="updateImg($event)" class="form-control rounded-0 mb-2" accept="image/*">
			<div class="ratio ratio-1x1">
				<img [src]="user.img" alt="img" class="object-fit-cover w-100">
			</div>
		</div>
		<div class="col-12 col-lg mb-4 fs-4" data-aos="zoom-in">
			<div class="card card-body rounded-0">
				<form [formGroup]="userFormGroup" (ngSubmit)="update()">
					<p class="m-0">{{ 'Регистрационный номер: ' + user.id }}</p>
					<p class="m-0">ФИО</p>
					<input type="text" formControlName="fio" class="form-control rounded-0 mb-2" minlength="1"
						   maxlength="255">
					<p class="m-0">Дата рождения</p>
					<input type="date" formControlName="date" class="form-control rounded-0 mb-2">
					<p class="m-0">Почта</p>
					<input type="email" formControlName="email" class="form-control rounded-0 mb-2" minlength="1"
						   maxlength="255">
					<button type="submit" class="btn btn-warning w-100 rounded-0" [disabled]="userFormGroup.invalid">
						Обновить
					</button>
				</form>
			</div>
		</div>
	</div>


</div>
