<div class="container-fluid py-5">

	<h1 class="text-center" data-aos="zoom-in">Добавить</h1>

	<div class="row d-flex justify-content-center mt-4" data-aos="zoom-in">
		<div class="col-auto">
			<a appNavigate [navigateURL]="'subscriptions'" class="btn btn-warning rounded-0">Назад</a>
		</div>
	</div>

</div>

<div class="container">

	<div class="card card-body rounded-0 fs-4" data-aos="zoom-in">
		<form [formGroup]="subscriptionFormGroup" (ngSubmit)="save()" class="row">
			<div class="col-12 col-lg-4 mb-2">
				<p class="m-0">Наименование</p>
				<input type="text" formControlName="name" class="form-control rounded-0" minlength="1" maxlength="255">
			</div>
			<div class="col-12 col-lg-4 mb-2">
				<p class="m-0">Длительность, дн.</p>
				<input type="number" formControlName="duration" class="form-control rounded-0" min="1" step="1"
					   max="1000">
			</div>
			<div class="col-12 col-lg-4 mb-2">
				<p class="m-0">Стоимость</p>
				<input type="number" formControlName="price" class="form-control rounded-0" min="1" step="0.01"
					   max="1000000">
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-warning rounded-0 w-100" [disabled]="subscriptionFormGroup.invalid">Добавить</button>
			</div>
		</form>
	</div>

</div>
