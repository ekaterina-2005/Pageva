<div class="card card-body rounded-0">
	<form [formGroup]="categoryFormGroup" (ngSubmit)="update()" class="row">
		<div class="col-12 col-lg-6 my-1">
			<input type="text" formControlName="name" class="form-control rounded-0" placeholder="Наименование">
		</div>
		<div class="col-12 col-lg my-1">
			<button type="submit" class="btn btn-warning rounded-0 w-100" [disabled]="categoryFormGroup.invalid">
				Обновить
			</button>
		</div>
		<div class="col-12 col-lg my-1">
			<a (click)="delete()" class="btn btn-primary rounded-0 w-100">Удалить</a>
		</div>
	</form>
</div>
