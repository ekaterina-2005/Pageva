<div class="container-fluid py-5">

	<h1 class="text-center" data-aos="zoom-in">Добавить</h1>

	<div class="row d-flex justify-content-center mt-4" data-aos="zoom-in">
		<div class="col-auto">
			<a appNavigate [navigateURL]="'books'" class="btn btn-warning rounded-0">Назад</a>
		</div>
	</div>

</div>

<div class="container">

	<div class="card card-body rounded-0 fs-4" data-aos="zoom-in">
		<form [formGroup]="bookFormGroup" (ngSubmit)="save()" class="row">
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Наименование</p>
				<input type="text" formControlName="name" class="form-control rounded-0" minlength="1" maxlength="255">
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Автор</p>
				<input type="text" formControlName="author" class="form-control rounded-0" minlength="1"
					   maxlength="255">
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Дата издания</p>
				<input type="date" formControlName="date" class="form-control rounded-0">
			</div>
			<div *ngIf="type === 'ORDINARY'" class="col-12 col-lg-6 mb-2">
				<p class="m-0">Стоимость аренды в сутки</p>
				<input type="number" formControlName="price" class="form-control rounded-0" min="0" step="0.01"
					   max="1000000">
			</div>
			<div *ngIf="type === 'ORDINARY'" class="col-12 col-lg-6 mb-2">
				<p class="m-0">Количество</p>
				<input type="number" formControlName="quantity" class="form-control rounded-0" min="0" step="1"
					   max="1000000">
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Возрастная категория</p>
				<select (change)="changeAge($event)" class="form-select rounded-0">
					<option disabled selected>Выберите</option>
					<option *ngFor="let i of ages | keyvalue" [value]="i.key" [label]="i.value"></option>
				</select>
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Жанр</p>
				<select (change)="changeCategoryId($event)" class="form-select rounded-0">
					<option disabled selected>Выберите</option>
					@for (i of categories; track i.id) {
						<option [value]="i.id" [label]="i.name"></option>
					}
				</select>
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Количество страниц</p>
				<input type="number" formControlName="page" class="form-control rounded-0" min="1" step="1"
					   max="1000000">
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Ориентировочное время чтения</p>
				<input type="time" formControlName="read" class="form-control rounded-0">
			</div>
			<div class="col-12 col-lg-6 mb-2">
				<p class="m-0">Тип книги</p>
				<select (change)="changeType($event)" class="form-select rounded-0">
					<option disabled selected>Выберите</option>
					<option *ngFor="let i of types | keyvalue" [value]="i.key" [label]="i.value"></option>
				</select>
			</div>
			<div class="col-12 col-lg mb-2">
				<p class="m-0">Фото</p>
				<input type="file" (change)="changeImg($event)" class="form-control rounded-0" accept="image/*">
			</div>
			<div *ngIf="type === 'ELECTRONIC'" class="col-12 col-lg mb-2">
				<p class="m-0">Файл</p>
				<input type="file" (change)="changeFile($event)" class="form-control rounded-0" accept="*/*">
			</div>
			<div class="col-12 mb-2">
				<p class="m-0">Описание</p>
				<textarea formControlName="description" class="form-control rounded-0" minlength="1"
						  maxlength="5000"></textarea>
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-warning rounded-0 w-100" [disabled]="!checkSubmit()">Добавить</button>
			</div>
		</form>
	</div>

</div>
